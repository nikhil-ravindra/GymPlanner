<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gym Planner — track diet, workouts, streaks, PRs and climb the ranks. Made by Nikhil Ravindra.">
  <meta name="theme-color" content="#0a0c09">
  <title>Gym Planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c09'/%3E%3Cpath d='M6 12v8M10 9v14M22 9v14M26 12v8M10 16h12' stroke='%23c6ff33' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- =========================================================
     MARKUP
     ========================================================= -->
<div id="landing">
  <button class="icon-btn landing-mode" data-act="mode" aria-label="Toggle light or dark mode" id="landing-mode"></button>
  <div class="hero-card" data-go="dash" role="button" tabindex="0" aria-label="Enter Gym Planner">
    <div class="hero-plates" aria-hidden="true"></div>
    <p class="eyebrow hero-eyebrow">Diet · Workout · Rank</p>
    <h1 class="hero-title"><span class="l1">GYM</span><span class="l2">PLANNER</span></h1>
    <p class="hero-sub">Made by <b>Nikhil Ravindra</b></p>
    <button class="enter-btn" data-go="dash">Enter <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="wrap topbar-in">
      <button class="brand" data-go="dash" aria-label="Dashboard"><span>GYM</span><span>PLANNER</span></button>
      <div class="greet"><b id="greet">Hello</b><span id="top-date"></span></div>
      <div class="top-actions">
        <button class="icon-btn" data-act="mode" id="top-mode" aria-label="Toggle light or dark mode"></button>
        <button class="icon-btn" data-act="open-data" id="top-data" aria-label="Data and settings"></button>
        <button class="home-btn" data-go="landing" id="top-home"><span>Home</span></button>
      </div>
    </div>
  </header>
  <nav class="tabs wrap" aria-label="Sections">
    <button class="tab" data-go="dash">Dashboard</button>
    <button class="tab" data-go="diet">Diet</button>
    <button class="tab" data-go="workout">Workout</button>
    <button class="tab" data-go="rank">Rank</button>
  </nav>
  <main class="wrap main">
    <section class="view" id="v-dash"></section>
    <section class="view" id="v-diet"></section>
    <section class="view" id="v-workout"></section>
    <section class="view" id="v-rank"></section>
  </main>
  <footer class="wrap foot">Gym Planner · Made by Nikhil Ravindra · Your data stays in this browser</footer>
</div>

<!-- floating rest timer -->
<div id="rest" role="timer" aria-label="Rest timer">
  <div class="rest-ring"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="19"/><circle class="fg" id="rest-fg" cx="23" cy="23" r="19" stroke-dasharray="119.38" stroke-dashoffset="0"/></svg></div>
  <div><span class="rest-time" id="rest-time">1:30</span><span class="rest-lbl">Rest</span></div>
  <button class="icon-btn sm rest-hide-xs" data-act="rest-minus" aria-label="Minus 15 seconds" id="rest-minus"></button>
  <button class="rest-play" data-act="rest-toggle" id="rest-play" aria-label="Start rest timer"></button>
  <button class="icon-btn sm" data-act="rest-plus" aria-label="Plus 15 seconds" id="rest-plus"></button>
  <button class="icon-btn sm" data-act="rest-reset" aria-label="Reset timer" id="rest-reset"></button>
  <select id="rest-preset" aria-label="Rest length">
    <option value="60">60s</option><option value="90">90s</option><option value="120">2m</option><option value="180">3m</option><option value="240">4m</option>
  </select>
</div>

<div id="modal" hidden><div class="modal-back" data-act="modal-close"></div><div class="modal-card" role="dialog" aria-modal="true"><button class="icon-btn sm modal-x" data-act="modal-close" aria-label="Close" id="modal-x"></button><div id="modal-body"></div></div></div>
<div id="rankup" hidden></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script src="js/app.js"></script>
</body>
</html>
